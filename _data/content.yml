  introduction: |
    I am currently a research assistant (Wissenschaftlicher Mitarbeiter) at Bielefeld University, working in the group of Prof. Matthias Erbar.

    My research interests are optimal transport and geometric analysis on metric measure spaces. 
    Key words for my current and past works include synthetic curvature bounds, rigidity phenomena, and superposition principles.
