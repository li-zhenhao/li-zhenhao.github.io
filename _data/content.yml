    - title: "Current position"
      text: |
        I am currently a research assistant (Wiss. Mitarbeiter) at Bielefeld University, in the group of Prof. Matthias Erbar.
    - title: "Research interests"
      text: |
        My research interests are optimal transport and geometric analysis on metric measure spaces.
        Keywords for my current and past work include synthetic curvature bounds, rigidity phenomena, and superposition principles.
