research:
  - title: "Metric and synthetic geometry"
    description: |
      Rigidity questions, rectifiability, and geometric structure in
      nonsmooth spaces.

  - title: "Optimal transport and curvature"
    description: |
      Transport-based formulations of curvature and their static and
      time-dependent consequences.

  - title: "Analysis on metric measure spaces"
    description: |
      Lipschitz functions, derivations, superposition principles, and
      weak differential structures.

